url: https://monty-se.github.io/skellam/

template:
  bootstrap: 5
  math-rendering: mathjax
  bslib:
    primary: "#0072B2"
    link-color: "#0072B2"

home:
  title: "skellam: the Skellam distribution in R"
  description: >
    Density, distribution function, quantiles, random generation, maximum
    likelihood and regression for the difference of two Poisson counts.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/validate_skellam.html
    github:
      icon: fa-github
      href: https://github.com/monty-se/skellam
      aria-label: GitHub

reference:
- title: The Skellam distribution
  desc: >
    Density, distribution function, quantile function and random generation,
    with saddlepoint approximations to the density and distribution function.
  contents:
  - skellam
- title: Moments and generating functions
  desc: >
    Theoretical moments and cumulants of any order, and the moment,
    characteristic and probability generating functions.
  contents:
  - skellam.moments
- title: Estimation
  desc: >
    Fitting the distribution to a sample of differences, and regression with
    covariates on both rates.
  contents:
  - skellam.fit
  - skellam.reg
  - skellam_reg-methods
- title: Goodness of fit
  desc: >
    Testing whether a sample comes from a Skellam distribution.
  contents:
  - skellam.test
- title: Diagnostic plots
  desc: >
    Rootograms, PIT histograms and quantile-residual plots comparing data with
    a fit, and the package's ggplot2 theme and colours.
  contents:
  - skellam-plots
  - skellam_palette
- title: Deprecated
  desc: >
    Kept for backward compatibility until version 1.0.0.
  contents:
  - skellam.mle

articles:
- title: Articles
  navbar: ~
  contents:
  - validate_skellam

news:
  cran_dates: false

footer:
  structure:
    left: developed_by
    right: built_with
